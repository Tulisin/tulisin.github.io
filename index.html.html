<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tulisin - jasa tulis rapi dengan plotter</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#D9ECFF;--card:#FFFFFF;--line:#B5D3F2;--ink:#1D4F9C;--text:#1F2A3B;--muted:#55657D}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:'Nunito Sans',system-ui,sans-serif;color:var(--text);line-height:1.6;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding:0 20px 40px}
h1,h2,h3{font-family:'Caveat',cursive,sans-serif;color:var(--ink);font-weight:600;line-height:1.1;margin:0}
h1{font-size:clamp(3.2rem,11vw,5.5rem);text-align:center;padding-top:44px}
h2{font-size:2.3rem;margin:8px 0 14px}
h3{font-size:1.5rem;margin-bottom:8px}
.tagline{text-align:center;color:var(--muted);margin:6px 0 28px}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:560px){.menu{grid-template-columns:repeat(2,1fr)}}
.tile{display:flex;align-items:center;justify-content:center;text-align:center;min-height:110px;padding:14px;background:var(--card);color:var(--ink);font-weight:700;font-size:1.05rem;text-decoration:none;border:3px solid transparent;border-radius:20px;box-shadow:0 1px 0 var(--line)}
.tile:hover{border-color:var(--ink)}
.order{display:flex;justify-content:center;margin-top:40px}
.order .tile{background:var(--ink);color:#fff;min-width:240px;min-height:76px;font-size:1.2rem}
.order .tile:hover{border-color:var(--text)}
a:focus-visible,summary:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.back{display:inline-block;margin-top:24px;font-weight:700;color:var(--ink);text-decoration:none}
.card{background:var(--card);border-radius:18px;padding:18px 20px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:12px}
.ph,.grid img{aspect-ratio:4/3;width:100%;object-fit:cover;border-radius:14px}
.ph{display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);border:2px dashed var(--line);padding:10px;font-size:.92rem}
details{background:var(--card);border-radius:18px;padding:14px 18px;margin-bottom:12px}
summary{cursor:pointer;font-weight:700;color:var(--ink);font-size:1.05rem}
details>p{margin:8px 0 0}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
th{color:var(--ink)}
.scroll{overflow-x:auto}
.note{color:var(--muted);font-size:.9rem}
ol,ul{margin:0;padding-left:22px}
li{margin-bottom:8px}
footer{text-align:center;color:var(--muted);font-size:.9rem;padding-top:32px}

.bar{display:flex;align-items:center;justify-content:space-between;padding:16px 0 0}
.mbtn{font:inherit;font-weight:700;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:6px 14px;cursor:pointer}
.logo{font-family:'Caveat',cursive,sans-serif;font-size:2.2rem;color:var(--ink);text-decoration:none;line-height:1}
.sp{width:76px}
.drop{background:var(--card);border-radius:16px;margin-top:10px;padding:8px;display:grid}
.drop a{padding:10px 14px;border-radius:10px;color:var(--ink);font-weight:700;text-decoration:none}
.drop a:hover{background:var(--bg)}
.hero{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--ink);color:#fff;border-radius:24px;padding:32px 28px;margin-top:18px;overflow:hidden}
.hero-t{font-family:'Caveat',cursive,sans-serif;font-weight:600;font-size:clamp(2.6rem,9vw,4rem);line-height:1;margin:0;color:#fff;text-align:left;padding:0}
.hero p{margin:10px 0 20px;opacity:.9}
.cta{display:inline-block;background:#fff;color:var(--ink);font-weight:700;text-decoration:none;padding:11px 22px;border-radius:14px}
.cta:focus-visible,.cat:focus-visible,.mbtn:focus-visible,.logo:focus-visible{outline:3px solid #fff;outline-offset:2px}
.hero svg{width:min(42%,230px);flex:none}
.badge{position:absolute;top:14px;right:14px;width:70px;height:70px;border-radius:50%;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:.78rem;line-height:1.15;transform:rotate(8deg)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:14px;margin-top:26px}
.cat{display:flex;flex-direction:column;align-items:center;text-align:center;text-decoration:none;color:var(--text);gap:2px}
.circ{width:68px;height:68px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--ink);border:3px solid transparent;margin-bottom:6px}
.cat:hover .circ{border-color:var(--ink)}
.circ svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cat b{font-size:.95rem}
.cat small{color:var(--muted);font-size:.8rem}
@media (max-width:520px){.hero{flex-direction:column-reverse;align-items:flex-start}.hero svg{width:55%;align-self:center}}

.slider{position:relative;margin-top:24px;border-radius:24px;overflow:hidden;background:var(--ink)}
.slider{touch-action:pan-y;user-select:none;-webkit-user-select:none}
.track{display:flex;transition:transform .7s ease}
.slide{flex:0 0 100%;min-height:240px;padding:34px 30px 48px;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative}
.slide p{margin:10px 0 0;opacity:.92;max-width:26em}
.slide svg{width:min(38%,210px);flex:none}
.dots{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:8px}
.dots button{width:10px;height:10px;border-radius:50%;border:0;padding:0;background:rgba(255,255,255,.4);cursor:pointer}
.dots button[aria-current="true"]{background:#fff}
.dots button:focus-visible{outline:3px solid #fff;outline-offset:3px}
@media (prefers-reduced-motion:reduce){.track{transition:none}}
@media (max-width:520px){.slide{flex-direction:column-reverse;align-items:flex-start}.slide svg{width:45%;align-self:center}}

.slide{background:linear-gradient(135deg,#3A7BE0 0%,#1D4F9C 55%,#12336E 100%)}
.slide.scene{min-height:300px;padding-right:64px;overflow:hidden;background:linear-gradient(160deg,#7CC0FF 0%,#3A84E6 52%,#1F5CB8 100%)}
.slide.scene>*{position:relative;z-index:1}
.slide.scene::before{content:"";position:absolute;right:6%;top:-70px;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.17)}
.slide.scene::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-72px;height:124px;border-radius:50%;background:rgba(255,255,255,.3)}
.mwrap{flex:none;display:flex;justify-content:center;padding:0 30px}
.mwrap{position:relative}
.maskot{display:block;height:225px;width:auto;transform-origin:var(--sx,50%) 100%;animation:bob 3.4s ease-in-out infinite;filter:drop-shadow(5px 7px 6px rgba(10,30,80,.32))}
.gshadow{position:absolute;left:var(--sx,50%);bottom:-5px;width:54px;height:11px;margin-left:-27px;border-radius:50%;background:radial-gradient(ellipse,rgba(10,30,80,.6),rgba(10,30,80,0) 72%)}
.slide.scene:not(.first) .hero-t{font-size:clamp(2.2rem,6vw,3rem)}
.slide.scene p{max-width:34em}
.slide.first .hero-t{font-size:clamp(3.4rem,13vw,5.4rem)}
.slide.first p{font-size:1.2rem;margin-top:8px}
.maskot.khawatir{animation:gemetar 4.2s ease-in-out infinite}
@keyframes gemetar{0%,50%{transform:rotate(0) scale(1)}54%{transform:rotate(-3deg) scale(1.01)}58%{transform:rotate(3deg)}62%{transform:rotate(-3deg)}66%{transform:rotate(2.5deg)}70%{transform:rotate(-1.5deg)}74%,100%{transform:rotate(0) scale(1)}}
@keyframes bob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@media (prefers-reduced-motion:reduce){.maskot,.maskot.khawatir{animation:none}}
@media (max-width:520px){.slide.scene{flex-direction:row;align-items:center;min-height:250px;padding-right:30px}.maskot{height:165px}.mwrap{padding:0 8px}.slide.scene:not(.first) .hero-t{font-size:clamp(1.9rem,8vw,2.6rem)}.slide.scene::before{right:-40px;width:220px;height:220px}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<main id="home">
  <section class="slider" aria-roledescription="carousel" aria-label="Sorotan Tulisin">
    <div class="track" id="track"></div>
    <div class="dots" id="dots"></div>
  </section>
  <nav class="cats" id="menu"></nav>
  <div class="order"><a class="tile" href="#pesan">Pesan sekarang</a></div>
</main>
<main id="page" hidden>
  <a class="back" href="#">&lt; Kembali ke menu</a>
  <div id="content"></div>
</main>
</div>

<script>
/* ===== BAGIAN YANG BOLEH DIUBAH: semua isi dan harga ada di sini ===== */
const CONFIG = {
  hargaMinimum: 5000,       // harga minimum per pesanan (contoh)
  hurufTanpaSpasi: true,    // true = spasi tidak dihitung
  hurufPerHalaman: 1500,    // perkiraan huruf per halaman folio (contoh)
  // Slide banner di halaman utama. gambar: "senang" atau "khawatir" = tampilkan maskot yang sesuai.
  banner: [
    {judul:"Tulisin", teks:"Jasa tulis profesional", gambar:"senang"},
    {judul:"Tugas menumpuk, tangan pegal?", teks:"Serahkan ke kami. Kirim teksnya, kami tuliskan dengan rapi.", gambar:"khawatir"},
    {judul:"Harga jelas sebelum bayar", teks:"Dihitung per huruf, jadi kamu tahu biayanya sebelum membayar.", gambar:false}
  ],
  bannerDetik: 5,           // jeda pindah slide (detik)
  // foto: isi dengan nama berkas, misalnya "foto/tugas1.jpg". Kosongkan jika belum ada.
  jasa: [
    {nama:"Penulisan tugas", desk:"Tugas sekolah dan kuliah yang ditulis rapi.", harga:5, foto:[]},
    {nama:"Penulisan surat", desk:"Surat resmi maupun surat pribadi.", harga:6, foto:[]},
    {nama:"Penulisan ijazah", desk:"Khusus untuk sekolah atau lembaga yang berwenang.", harga:8, foto:[]}
  ],
  font: [
    {nama:"Font 1", tambah:0, foto:""},
    {nama:"Font 2", tambah:1, foto:""},
    {nama:"Font 3", tambah:2, foto:""}
  ],
  ketentuan: [
    "Harga dihitung dari jumlah huruf pada teks yang kamu konfirmasi.",
    "Kamu bisa mengubah teks sebelum membayar. Setelah dibayar, teks tidak bisa diubah.",
    "Pesanan baru dikerjakan setelah pembayaran berhasil.",
    "Foto tulisan tangan yang sulit dibaca bisa ditolak. Kirim teks ketikan jika memungkinkan.",
    "Perkiraan waktu pengerjaan: akan diisi."
  ],
  cara: [
    "Pilih jasa dan font yang kamu mau.",
    "Kirim teks, dokumen, atau foto tulisanmu.",

    ["Bagaimana kalau aku mengirim foto?","Teks pada fotomu akan dibaca otomatis, lalu kamu cek dan perbaiki sebelum membayar. Foto yang terang, lurus, dan jelas memberi hasil terbaik."],
    ["Kapan tulisanku selesai?","Kami menghubungi nomor WhatsAppmu begitu tulisan selesai. Perkiraan waktunya akan diumumkan di halaman ini."],
    ["Bagaimana kalau pembayaranku gagal?","Pesanan tidak diproses sampai pembayaran berhasil. Kamu bisa mencoba membayar lagi."]
  ]
};
/* ===== AKHIR BAGIAN YANG BOLEH DIUBAH ===== */

const C = CONFIG, $ = id => document.getElementById(id);
const rp = n => "Rp " + n.toLocaleString("id-ID");
const img = (src, label) => src ? `<img src="${src}" alt="${label}">` : `<div class="ph">${label} (foto segera ditambahkan)</div>`;

const PAGES = {
  jasa: ["Jasa", () => C.jasa.map(j =>
    `<details><summary>${j.nama}</summary><p>${j.desk}</p><div class="grid">` +
    (j.foto.length ? j.foto : ["",""]).map((f,i) => img(f, "Contoh " + j.nama.toLowerCase())).join("") + `</div></details>`).join("")],
  font: ["Jenis tulisan", () => `<div class="grid">` + C.font.map(f =>
    `<div class="card"><h3>${f.nama}</h3>${img(f.foto, "Contoh tulisan " + f.nama)}</div>`).join("") + `</div>`],
  harga: ["Harga", () => `
    <div class="card"><h3>Jasa</h3><div class="scroll"><table><thead><tr><th>Jasa</th><th>Harga per huruf</th></tr></thead><tbody>` +
    C.jasa.map(j => `<tr><td>${j.nama}</td><td>${rp(j.harga)}</td></tr>`).join("") + `</tbody></table></div></div>
    <div class="card"><h3>Font</h3><div class="scroll"><table><thead><tr><th>Font</th><th>Tambahan per huruf</th></tr></thead><tbody>` +
    C.font.map(f => `<tr><td>${f.nama}</td><td>${f.tambah ? "+ " + rp(f.tambah) : "Gratis"}</td></tr>`).join("") + `</tbody></table></div></div>
    <div class="card"><p style="margin:0">Harga akhir = (harga jasa + tambahan font) x jumlah huruf. Spasi ${C.hurufTanpaSpasi ? "tidak" : "ikut"} dihitung. Minimum pesanan ${rp(C.hargaMinimum)}. Satu halaman folio kira-kira ${C.hurufPerHalaman.toLocaleString("id-ID")} huruf.</p>
    <p class="note" style="margin-bottom:0">Angka masih contoh dan akan diperbarui.</p></div>`],
  ketentuan: ["Ketentuan", () => `<div class="card"><ul>` + C.ketentuan.map(t => `<li>${t}</li>`).join("") + `</ul></div>`],
  faq: ["FAQ", () => C.faq.map(([q,a]) => `<details><summary>${q}</summary><p>${a}</p></details>`).join("")],
  cara: ["Cara pesan", () => `<div class="card"><ol>` + C.cara.map(t => `<li>${t}</li>`).join("") + `</ol></div>`],
  pesan: ["Pesan sekarang", () => `<div class="card"><p style="margin:0">Fitur pemesanan sedang disiapkan. Di sini nanti kamu memilih jasa dan font, mengirim teks, lalu membayar dengan QRIS.</p></div>`]
};

const ICONS={
  jasa:'<path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 7l3 3"/>',
  font:'<text x="2" y="17" font-size="14" font-weight="700" fill="currentColor" stroke="none" font-family="sans-serif">Aa</text>',
  harga:'<path d="M3 12V4h8l9 9-8 8z"/><circle cx="7.5" cy="8.5" r="1.2"/>',
  ketentuan:'<path d="M5 4h14v16H5z"/><path d="M8 9l1.5 1.5L12 8M8 15l1.5 1.5L12 14M14 10h3M14 16h3"/>',
  cara:'<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/>',
  faq:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 115 0c0 1.5-2.5 2-2.5 3.5M12 17h.01"/>'
};
const SUB={jasa:()=>C.jasa.length+" jasa",font:()=>C.font.length+" jenis",harga:()=>"daftar harga",ketentuan:()=>"aturan",cara:()=>C.cara.length+" langkah",faq:()=>C.faq.length+" pertanyaan"};
const KEYS=["jasa","font","harga","ketentuan","cara","faq"];
$("menu").innerHTML=KEYS.map(k=>`<a class="cat" href="#${k}"><span class="circ"><svg viewBox="0 0 24 24">${ICONS[k]}</svg></span><b>${PAGES[k][0]}</b><small>${SUB[k]()}</small></a>`).join("");

};
const maskot=k=>{const m=MASKOT[k];return m?`<div class="mwrap" style="--sx:${m.sx}"><img class="maskot ${m.cls}" src="${m.src}" alt="${m.alt}"><span class="gshadow"></span></div>`:"";};
const n=C.banner.length;
$("track").innerHTML=C.banner.map((b,i)=>`<div class="slide${MASKOT[b.gambar]?" scene":""}${b.gambar==="senang"?" first":""}" role="group" aria-label="Slide ${i+1} dari ${n}"><div><div class="hero-t">${b.judul}</div><p>${b.teks}</p></div>${maskot(b.gambar)}</div>`).join("");
$("dots").innerHTML=C.banner.map((b,i)=>`<button aria-label="Slide ${i+1}" data-i="${i}"></button>`).join("");
let cur=0,timer=null;
function go(i){cur=(i+n)%n;$("track").style.transform=`translateX(-${cur*100}%)`;
  document.querySelectorAll("#dots button").forEach((d,k)=>d.setAttribute("aria-current",k===cur));}
function play(){stop();if(n>1&&!matchMedia("(prefers-reduced-motion:reduce)").matches)timer=setInterval(()=>go(cur+1),C.bannerDetik*1000);}
function stop(){clearInterval(timer);}
$("dots").onclick=e=>{const b=e.target.closest("button");if(b){go(+b.dataset.i);play();}};
const sl=document.querySelector(".slider");
sl.addEventListener("mouseenter",stop);sl.addEventListener("mouseleave",play);
sl.addEventListener("focusin",stop);sl.addEventListener("focusout",play);
let sx=0,sy=0,down=false;
sl.addEventListener("pointerdown",e=>{sx=e.clientX;sy=e.clientY;down=true;});
sl.addEventListener("pointerup",e=>{if(!down)return;down=false;
  const dx=e.clientX-sx,dy=e.clientY-sy;
  if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)){go(dx<0?cur+1:cur-1);}
  play();});
sl.addEventListener("pointercancel",()=>{down=false;});
go(0);play();
function route(){
  const k = location.hash.slice(1), p = PAGES[k];
  $("home").hidden = !!p; $("page").hidden = !p;
  if (p) $("content").innerHTML = `<h2>${p[0]}</h2>` + p[1]();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
</script>
